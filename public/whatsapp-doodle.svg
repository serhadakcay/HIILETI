<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0b141a"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.06">
    <!-- Chat bubble 1 -->
    <path d="M 40 40 C 40 28, 70 28, 70 40 C 70 48, 55 52, 50 56 L 45 62 L 46 54 C 42 52, 40 46, 40 40 Z"/>
    <circle cx="50" cy="40" r="1.5" fill="#ffffff"/>
    <circle cx="55" cy="40" r="1.5" fill="#ffffff"/>
    <circle cx="60" cy="40" r="1.5" fill="#ffffff"/>

    <!-- Coffee / Tea cup -->
    <path d="M 120 40 L 140 40 C 140 55, 120 55, 120 40 Z"/>
    <path d="M 140 43 C 145 43, 145 49, 140 49"/>
    <line x1="116" y1="56" x2="144" y2="56"/>

    <!-- Smiley face -->
    <circle cx="220" cy="50" r="14"/>
    <circle cx="215" cy="46" r="1.5" fill="#ffffff"/>
    <circle cx="225" cy="46" r="1.5" fill="#ffffff"/>
    <path d="M 215 54 Q 220 58 225 54"/>

    <!-- Headphones -->
    <path d="M 310 50 A 15 15 0 0 1 340 50"/>
    <rect x="306" y="48" width="5" height="10" rx="2" fill="#ffffff"/>
    <rect x="339" y="48" width="5" height="10" rx="2" fill="#ffffff"/>

    <!-- Clock -->
    <circle cx="50" cy="140" r="12"/>
    <polyline points="50,132 50,140 56,140"/>

    <!-- Heart -->
    <path d="M 130 135 C 130 130, 122 126, 118 132 C 114 126, 106 130, 106 135 C 106 144, 118 150, 118 150 C 118 150, 130 144, 130 135 Z"/>

    <!-- Star -->
    <polygon points="220,125 223,133 231,133 225,138 227,146 220,141 213,146 215,138 209,133 217,133"/>

    <!-- Camera -->
    <rect x="310" y="130" width="24" height="18" rx="3"/>
    <circle cx="322" cy="139" r="5"/>
    <path d="M 314 130 L 317 126 L 327 126 L 330 130"/>

    <!-- Paper airplane -->
    <path d="M 40 220 L 70 230 L 52 238 L 48 248 Z"/>
    <line x1="40" y1="220" x2="52" y2="238"/>

    <!-- Lock -->
    <rect x="120" y="225" width="18" height="14" rx="2"/>
    <path d="M 124 225 L 124 219 A 5 5 0 0 1 134 219 L 134 225"/>
    <circle cx="129" cy="232" r="1.5" fill="#ffffff"/>

    <!-- Music note -->
    <ellipse cx="215" cy="235" rx="3" ry="2.5" fill="#ffffff"/>
    <ellipse cx="227" cy="231" rx="3" ry="2.5" fill="#ffffff"/>
    <line x1="218" y1="235" x2="218" y2="220"/>
    <line x1="230" y1="231" x2="230" y2="216"/>
    <line x1="218" y1="220" x2="230" y2="216"/>

    <!-- Game controller -->
    <rect x="310" y="220" width="28" height="16" rx="6"/>
    <line x1="316" y1="228" x2="322" y2="228"/>
    <line x1="319" y1="225" x2="319" y2="231"/>
    <circle cx="330" cy="226" r="1" fill="#ffffff"/>
    <circle cx="334" cy="230" r="1" fill="#ffffff"/>

    <!-- Pizza slice -->
    <path d="M 45 320 L 65 315 L 55 345 Z"/>
    <path d="M 45 320 Q 55 315 65 315"/>
    <circle cx="53" cy="326" r="1" fill="#ffffff"/>

    <!-- Thumbs up -->
    <path d="M 125 325 C 122 325, 120 327, 120 330 L 120 340 L 132 340 C 135 340, 137 338, 136 335 L 135 330 C 137 330, 137 325, 134 325 L 130 325 L 132 318 C 132 315, 128 315, 127 318 Z"/>

    <!-- Alien / Monster -->
    <rect x="210" y="320" width="20" height="16" rx="5"/>
    <circle cx="216" cy="326" r="1.5" fill="#ffffff"/>
    <circle cx="224" cy="326" r="1.5" fill="#ffffff"/>
    <line x1="215" y1="316" x2="215" y2="320"/>
    <line x1="225" y1="316" x2="225" y2="320"/>

    <!-- Envelope -->
    <rect x="310" y="320" width="24" height="16" rx="2"/>
    <polyline points="310,322 322,330 334,322"/>
  </g>
</svg>
